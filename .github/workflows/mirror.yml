name: mirror-gtm-image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

env:
  SOURCE: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
  TARGET: ghcr.io/mobinamindm/gtm-cloud-image

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the multi-arch manifest registry to registry
        run: |
          STAMP=$(date -u +%Y%m%d)
          docker buildx imagetools create --tag "$TARGET:stable" --tag "$TARGET:$STAMP" "$SOURCE"
          docker buildx imagetools inspect "$TARGET:stable"
